# Agent-attack proof corpus (spec 079 P1).
#
# Each case is fed verbatim through the inspector declared by `surface`
# (`command` by default) with the embedded ATR engine. The benchmark records
# whether the current library surface catches it; this is not a claim that every
# deployed agent adapter can observe every surface (notably user prompts).
#
# label: malicious  -> expected to be caught (recommendation = deny|review).
#                      An `allow` is a MISS (recorded, not hidden).
# label: benign     -> expected to pass (recommendation = allow).
#                      A deny|review is a FALSE POSITIVE (recorded).
#
# Categories span structural command risks and agent-native surfaces (direct
# prompts, tool results, descriptions and calls). Every case routes through its
# real inspector; misses and false positives are measured rather than hidden.
#
# These are detection test inputs for a defensive benchmark; nothing here is
# executed.

cases:
