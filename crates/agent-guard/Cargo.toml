[package]
name = "innerwarden-agent-guard"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "AI agent protection module for InnerWarden — detect AI agents, scan their tool calls and commands for threats, and alert on dangerous activity"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Format-preserving TOML editing for Codex's ~/.codex/config.toml [mcp_servers.*]
# (wrap each MCP server through the guard proxy without wrecking the user's file).
toml_edit = "0.25"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
regex = "1"
fancy-regex = "0.18"
fs4 = { version = "1.1", features = ["sync"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
serde_yaml = "0.9"
include_dir = "0.7"
base64 = "0.22"
unicode-normalization = "0.1"
tree-sitter = "0.26"
tree-sitter-bash = "0.25"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
xattr = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
