[package]
name = "innerwarden-agent-guard"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "AI agent protection module for InnerWarden — detect AI agents, scan their tool calls and commands for threats, and alert on dangerous activity"

[dependencies]
innerwarden-safe-io = { path = "../safe-io" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The proxy's own hash of each MCP tool definition it pins (`mcp_proxy::pins`).
# Already in the tree through the CLI; same version.
sha2 = "0.11"
# Format-preserving TOML editing for Codex's ~/.codex/config.toml [mcp_servers.*]
# (wrap each MCP server through the guard proxy without wrecking the user's file).
toml_edit = "0.25"
# Parse the per-agent profiles file (`profiles`), the same crate the CLI
# parses its other configuration with.
toml = "1.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
regex = "1"
# The engines `regex` is built from, used directly so an ATR condition compiles
# only the forward automaton `is_match` needs (see `ForwardRegex` in
# src/rules.rs). Already in the tree through `regex`; same version.
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "perf", "unicode", "hybrid", "nfa-pikevm", "meta"] }
fancy-regex = "0.20"
# Read a pattern's syntax to find the literals every match of it contains
# (`atr_corpus::required_literals`), so a rule whose literals are not in a
# text is never compiled for it. Already in the tree through `regex`; same
# version.
regex-syntax = "0.8"
fs4 = { version = "1.1", features = ["sync"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
serde_yaml = "0.9"
base64 = "0.23"
unicode-normalization = "0.1"
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
# The MCP proxy's HTTP(S) client for a server reached by URL
# (`mcp_proxy::remote`). Already in the tree through the CLI; same version and
# features (rustls, the system's roots).
ureq = { version = "3", features = ["json"] }
# Inflate a repository's objects to read what a commit tracks without running
# git (`threats::git_tree`). Already in the tree through `ureq`; same version.
flate2 = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
xattr = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

# build.rs reads the embedded ATR corpus once into a table the binary carries
# (`src/atr_corpus.rs`), so a one-shot hook parses no YAML. The same crates
# and versions as the library's.
[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
regex-syntax = "0.8"

[dev-dependencies]
# The corpus's YAML, for the tests that hold the build's table to it.
include_dir = "0.7"
tempfile = "3"
serde_json = "1"

# `cfg(tarpaulin)` is set by cargo-tarpaulin while instrumenting. Declared so the
# perf-budget test can opt out of a coverage run without tripping the
# unexpected-cfg lint, which `-D warnings` would turn into a build failure.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)'] }
