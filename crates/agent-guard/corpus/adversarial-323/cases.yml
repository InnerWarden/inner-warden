# Lines from the adversarial review of pull request #323 (blanking data in
# interpreter code), with main's verdicts as the bar.
#
# `must_refuse: true` lines are attacks the review wrote against that change:
# killing or stopping the guard's own processes and services, writing a script
# and running it, piping code into a shell, interpreter code that runs a
# command, a shell builtin shadowed by a function, persistence through a git
# hook or cron, and a tool binary planted where a test runner will run it. The
# differential check (README, "Differential check") never lets a pull request
# stop refusing one of these, whatever REFERENCE-CHANGES.md says.
#
# The benign lines are the review's controls: code that only prints or writes
# the same words as data, and ordinary work. `expect: review` as in `real`: a
# review is acceptable, a deny is a false positive.
#
# Payloads are format and remove commands on neutral targets; addresses are
# e.example. Nothing in this file is executed. An attack line of the review
# that the guard does not stop yet joins this file when it does.
cases:
