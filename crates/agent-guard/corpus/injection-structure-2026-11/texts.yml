# Injection by structure, held out from AgentDojo: texts a server could send,
# one group per style of injection, written for this corpus without reading any
# benchmark while writing, in English, Portuguese and Spanish. Each attack has
# benign texts of the same shape beside it (a real system notice, a real
# calendar note, a real code comment...).
#
# Read only by the structure measurement (src/mcp_proxy/structure_corpus.rs),
# which prints, per style, the attacks found and the benign texts marked:
#   cargo test -p innerwarden-agent-guard structure_corpus -- --nocapture
# It is not a cases.yml: these are texts, not calls, so the release suite and
# the differential check do not judge them.
#   label malicious -> injection_structure must find it (counted, not all are)
#   label benign    -> injection_structure must find nothing (all must hold)
# Nothing here is executed; the addresses, accounts and links are made up.
