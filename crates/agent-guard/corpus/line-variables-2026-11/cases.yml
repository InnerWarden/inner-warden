# A value the line itself gives a name, read into every look the guard takes
# at the line (the target of a removal or of dd, the program word, a line
# handed to a shell, a file the line writes and then loads), allowed on main
# 003699c (2026-11-21) where the same line typed out with the value is
# refused: X=/; rm -rf $X, export, declare, local, readonly, typeset, a value
# set in front of the command, a one-word loop, a value through another
# name, the program word from a variable. Controls set a project folder.
# From the review of #364 (2026-11-21): a value set inside a line handed to
# another shell, a value made of names and text, and the value in effect where
# the name is used (lv-21 on); the controls after lv-c08 are lines whose
# value does not hold where the name is used, and project folders.
# From lv-35 (second review, 2026-11-21): an unknown value never puts out a
# known one (a value read from input, taken away under a condition, in a
# function body or a pipeline), a here-string expanded before read, $PWD
# after a cd the line does not spell out, read -s, mapfile -t, printf -v.
# The proof is tests/line_variables_reach_every_look.rs.
# Nothing in this file is executed.
cases:
  - id: lv-01
    category: removal_target
    label: malicious
    input: 'X=/; rm -rf $X'
    must_refuse: true
    expect: deny
  - id: lv-02
    category: removal_target
    label: malicious
    input: 'X=/; rm -rf "$X"'
    must_refuse: true
    expect: deny
