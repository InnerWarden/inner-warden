# A word the guard watches, acted on or only named (decision of the operator,
# 2026-11-21: the guard refuses the action on its files, processes and
# settings and on an agent's settings, not the mention of the name).
#
# gwm-001.. are actions, `must_refuse: true` with `expect: deny`: a line that
# stops, kills, disarms or rewrites the guard or an agent's settings, written
# beside or inside the slots the mention reading masks (a message, a search
# pattern, a here-document, inline code, a folder named after the guard), or
# whose output is run (`| sh`, `| at now`, a function, a file the line
# writes and runs). Each was refused by main on 2026-11-21 and must stay
# refused. gwm-c01.. are mentions, benign with `expect: review`: main
# refused them, the mention reading holds them for review instead.
# The proof is `tests/guard_word_mention_and_action.rs`; read by the
# differential check. Nothing in this file is executed.
cases:
  - id: gwm-001
    category: guard_word_action
    label: malicious
    expect: deny
    must_refuse: true
    input: "systemctl stop innerwarden-agent"
  - id: gwm-002
    category: guard_word_action
    label: malicious
    expect: deny
    must_refuse: true
    input: "git commit -m 'wip' && systemctl stop innerwarden-agent"
