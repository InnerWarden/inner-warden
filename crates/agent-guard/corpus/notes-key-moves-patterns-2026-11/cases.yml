# Five readings of a line, measured 2026-11-25 and 2026-11-26 with
# analyze_command (and analyze_command_in where the folder matters: the
# search lines ran in a project of a home that holds
# ~/.claude/.credentials.json): the verdict of the branch before the change
# is in the comment above each case.
# - A here-document that cat only writes out as notes (a .md, .txt, .rst,
#   .adoc, .org, .log or .csv file no agent loads, or the terminal) is
#   text: what it says of a settings file or of inline code is not the line
#   rewriting it. A body the shell expands into commands, a file that is
#   run, an agent's file or folder, and a body handed to an interpreter
#   stay read.
# - The pattern a grep, egrep, fgrep, zgrep or rg searches for (the first
#   word that is no option, or the value of -e or --regexp) is text, never
#   a path: '//' is not the root folder. A file given by -f, and every
#   folder searched, are still read.
# - A verb that stops or kills is a word of its own (the kill in a package
#   named innerwarden-killchain is none), and the file a command's output
#   is redirected to is not what the command acts on. An input
#   redirection still is (xargs kill < a list of the guard's ids).
# - A private key, ~/.aws/credentials or ~/.kube/config moved out of the
#   store that holds it, or a store moved whole, is read as its removal; a
#   rename inside the same store stays free. A landing the text does not
#   give is read as out of the store.
# - After the line gives HOME a value (export, declare -x, a plain
#   assignment, braces, read from the text the line hands it, printf -v),
#   ~ and $HOME stand for it when the guard reads which of its files a
#   removal, move or edit reaches.
# - A here-document whose delimiter is not quoted runs its backtick
#   substitutions before cat reads it, as it runs $(...): they are read as
#   commands. A quoted delimiter, or an escaped backtick, stays text.
# nkp-0NN are benign (allowed after the change); nkp-1NN are must_refuse
# with expect: deny, the controls among them refused before and after.
# A relative name read from the folder the hook was given (rm -rf
# innerwarden/rules run in /etc) needs that folder, which this file does
# not carry: it is in the test.
# The proof is tests/notes_key_moves_patterns_and_home.rs; read by the
# differential check. Nothing in this file is executed.
