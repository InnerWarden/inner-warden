    input: "pkill -f 'i[n]nerwarden'"
    must_refuse: true
    expect: deny
  # 1.6.15: deny (disabling or tampering with security monitoring: pkill -f innerwarden)
  - id: gle-007
    category: prefix_word
    label: malicious
    input: "env pkill -f innerwarden"
    must_refuse: true
    expect: deny
  # 1.6.15: deny (disabling or tampering with security monitoring: pkill -f innerwarden)
