# Ways to take the guard down that a review of its kill and stop rules
# found: a pkill -f pattern holding only a piece of the name or a regex the
# real pkill reads differently, a word in front of pkill (env, command,
# exec), process ids handed to kill from pgrep or pidof, killall -r, a unit
# glob given to systemctl stop, disable, mask or kill, a StopUnit sent over
# D-Bus (busctl, gdbus, dbus-send), the legacy `innerwarden mcp-proxy --`
# line, and the guard run from the user install path (~/.local/bin).
#
# `must_refuse: true` lines stop, kill or turn off the guard, or run it in a
# way that lowers it. `expect: deny`: only a refusal counts as caught. The
# differential check (README, "Differential check") never lets a pull request
# stop refusing one of these.
#
# The benign lines are controls that name a process or unit that is not the
# guard: `expect: allow` where nothing of the guard is named, `expect: review`
# where a word is shared with one of its parts (a docs server named after
# it, a proxy, a hook), so holding them is not a false positive.
#
# The comment above each case is the verdict of the released guard
# (`innerwarden check`, 1.6.15, 2026-11-20, from an empty home). An allow or
# a review on a must_refuse line is the gap this corpus holds open until the
# guard refuses it. Nothing in this file is executed.
cases:
  # 1.6.15: deny (disabling or tampering with security monitoring: kill InnerWarden)
  - id: gle-001
    category: partial_name
    label: malicious
    input: "pkill -f warden"
    must_refuse: true
    expect: deny
  # 1.6.15: deny (disabling or tampering with security monitoring: kill InnerWarden)
  - id: gle-002
    category: partial_name
    label: malicious
    input: "pkill -f inner"
    must_refuse: true
