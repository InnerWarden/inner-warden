# Clean versions of lines the guard refused to the people building it, one
# group per class of refusal: interpreter code in a here-document that edits
# text holding a word of the guard, notes appended with `cat >>` that name
# what the guard refuses, `gh pr merge --body` with such words, `git worktree
# remove` of a folder whose name holds the guard's name, a test filter of the
# `contain` help, `find -newer Cargo.toml`, and read-only `ssh`.
#
# own-027..own-049 add one group per family of the refusals of a week of
# that work: interpreter code (a here-document or `-c`) whose text names the
# guard or a secret path, a message to a person or a pane that names what the
# guard refuses, `ssh` with a read-only remote line, a text here-document or
# here-string quoting a refused line, read-only `gh` and `jq` against a
# repository whose name holds the guard's name, a wait loop on CI status,
# `sed` stripping colour codes from a log, a search whose pattern is a word
# the guard watches, and a path whose name holds the guard's name.
#
# Every line here edits text, reads, or runs tests: `label: benign` with no
# `expect`, so the right verdict is allow. Hosts, users and folders are
# neutral ones that keep the shape of the line.
#
# The comment above each case is the verdict of the released guard
# (`innerwarden check`, 1.6.15, 2026-11-20). A deny or a review there is a
# false positive this corpus holds as a baseline, not a pass. Some lines were
# refused in a session for a reason `check` cannot show (an argument that
# came out of an earlier result); `check` judges one line without a session.
#
# Nothing in this file is executed.
cases:
