# A file size limit lowered on the agent, or on what will start the guard's
# hook. A process that writes past its soft RLIMIT_FSIZE gets SIGXFSZ, whose
# default action ends it, and the limit is inherited: measured 2026-11-26
# with release binaries on a disposable home, the hook died by that signal
# before it answered, a refused command included, and the agent ran the
# call. rlm-0NN lower it for the agent's process ($PPID, getppid, a ppid
# read from ps, the pid pgrep or pidof finds for an agent) or for an agent
# or the guard the line starts, in shell, Python, Perl and Node, with
# quotes, a path and an alias: must_refuse: true with expect: deny.
# rlm-1NN lower a file size or core limit of another process, or the file
# size limit of the shell itself: expect: review. rlm-2NN are everyday
# limit lines (other limits, raising one, reading one, a lower limit for a
# program that is no agent): benign. The verdict of main 3979b3e (check)
# is in the comment above each case. The proof is the tests of
# src/threats/resource_limits.rs; read by the differential check.
# hook_limit_lowered (added the same day): a CPU, address space, data,
# open file or stack limit lowered below what an agent and its hook need
# (under 60 s, 256 MiB, 1024 files, 8 MiB of stack, or a variable) for the
# agent or an agent the line starts; a CPU limit of 0, 16 MiB of address
# space or three open files end the hook before it runs (measured with
# release binaries). rlm-013 to rlm-035 must_refuse: true with expect: deny;
# rlm-226 to rlm-250 are everyday tuning of those limits and the same
# option names in other programs: benign.
# Round 2 (2026-11-26): ulimit and setrlimit count for the agent only when
# a command after them starts an agent or the guard's hook (its command
# word); a name in a path, an argument or an option does not. rlm-036 to
# rlm-045 must_refuse: true with expect: deny; rlm-251 to rlm-263 benign
# (the shell's own limit with an agent, the guard or ppid only named).
# rlm-101 and rlm-103, the shell's or program's own file size limit, went
# from review to allowed.
# Round 3 (2026-11-26): prlimit and resource.prlimit set on another
# process's pid count for the agent when the line refers to the agent's
# process anywhere (getppid, process.ppid, $PPID, a ppid read from ps, an
# agent or the guard named, as pgrep finds it): the pid reaches the call
# through a variable, a list in code, backquotes or a loop. Their own pid
# ($$, 0) is the shell's limit, read as ulimit. A -p of the program prlimit
# starts is no pid. rlm-046 to rlm-064 must_refuse: true with expect: deny;
# rlm-264 to rlm-267 benign.
# Nothing in this file is executed.
