# A cd to a path the line spells out (or to a value the line gives a name)
# sets where a later removal by glob is judged, and a recursive change of
# owner, group or mode at the root, a system directory or a home is refused.
# Allowed on main 003699c (2026-11-21), judged by analyze_command with no
# working directory: cd / && rm -rf *, X=/; cd $X && rm -rf *, cd /etc;
# rm -rf ./*, chown -R nobody / (directly and through a variable), and
# chmod -R 777 / held only for review. Controls change to a project folder
# or a folder the line does not spell out, or change a project folder.
# From cg-39 (review of #364, 2026-11-21): find handing every file of
# the root, a system directory or a home to chown, chgrp or chmod (-exec,
# -execdir, -ok, -okdir), allowed on the branch of #368; the controls after
# cg-c18 pick some files out, keep to the starting point or start in a
# project folder.
# From cg-48 (second review, 2026-11-21): global options before the starting
# point, a starting point the line resolves to the root, a test that is not a
# literal name or path, the program behind a launcher or in a shell's -c line.
# The proof is tests/cd_then_glob_and_recursive_owner.rs.
# Nothing in this file is executed.
cases:
  - id: cg-01
    category: removal_after_cd
    label: malicious
    input: 'cd / && rm -rf *'
    must_refuse: true
    expect: deny
  - id: cg-02
    category: removal_after_cd
    label: malicious
    input: 'X=/; cd $X && rm -rf *'
    must_refuse: true
    expect: deny
