# The lines the five fixes of pull request #441 turned to deny, and the
# lines its first review found it let through, so the differential check
# holds every one. Measured 2026-11-25 with analyze_command, each line's
# verdict on main 542cc8c is in the comment above it.
#
# rw2-001.. the fixes of #441 (the guard's own units in a home and sed -i
# of its units, inline code removing a key or credential store, editors
# other than sed writing a file of the guard in place, luaposix spawn, Lua
# reaching os and io through require and package.loaded): allowed or held
# for review by main, denied by the branch. rw2-1NN the first review of
# #441: a worktree path that goes back out with .. after .worktrees, and a
# HOME the line sets under a name written in pieces (HO""ME, HO\ME,
# H"O"ME, printf -v, read -r): denied by main, let through by the branch
# before its second round. must_refuse: true with expect: deny on every
# rw2-NNN; rw2-c.. are controls. The proof is
# tests/guard_user_units.rs, tests/inline_code_deletes_credentials.rs,
# tests/lua_sinks_through_require.rs and
# tests/worktree_paths_that_leave_and_home_by_pieces.rs; read by the
# differential check. Nothing in this file is executed.
