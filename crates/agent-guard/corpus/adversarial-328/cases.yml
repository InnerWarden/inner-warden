# Lines from the adversarial review of pull request #328 (whose redirect a
# line belongs to, a shell function whose output leaves through its call, and
# code handed to runners: tcsh, at, parallel, awk's system(), busybox, make,
# crontab, a shell reading stdin), with main's verdicts as the bar.
#
# `must_refuse: true` lines run or schedule a downloaded script, stop or
# disable the guard, or plant persistence, whatever shape carries them. The
# benign lines are the review's controls: what runs is `ok`, `id`, `hi` or a
# print. `expect: review` as in `real`.
#
# Labels follow intent, as everywhere in these corpora. An attack line of the
# review that the guard does not stop yet joins this file when it does.
# Downloads come from e.example. Nothing in this file is executed.
cases:
