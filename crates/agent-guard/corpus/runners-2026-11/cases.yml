  # run-c19 and run-c20 were controls until 2026-11-20: by decision, a file
  # a program writes or a copy makes is not shown by the line, and running it
  # is held for review.
  - id: run-c19
    category: write_then_run
    label: malicious
    input: "python3 gen.py > r.sh && bash r.sh"
    must_refuse: true
    expect: review
  - id: run-c20
    category: write_then_run
    label: malicious
    input: "cp template.sh run.sh && sh run.sh"
    must_refuse: true
    expect: review
  # From the review of pull request #350 (2026-11-20): a write the line
  # does not show after one it shows (cp, mv, dd, install, sed -i, perl -pi,
  # gawk -i inplace, truncate, a program's output), and a file written then
  # run through a launcher the reading did not follow ($SHELL, exec and its
  # options, xargs and find -exec handing it the file, an absolute path, a
  # versioned name, env -S, a redirect on stdin), measured 2026-11-20 on main
  # 1cf3c3f: run-37..43, 46, 49, 51, 53..55, 58, 63, 69 allowed there.
  - id: run-37
    category: write_not_shown_after_shown
    label: malicious
    input: "echo 'id' > x.sh && cp evil.sh x.sh && sh x.sh"
    must_refuse: true
    expect: review
  - id: run-38
