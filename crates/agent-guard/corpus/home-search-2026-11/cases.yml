# Searches of the whole home whose output can carry a private key: lines of
# context around a match (a key's body follows its first line), a key marker
# or a secret prefix as the pattern, and the searchers other than grep that
# read hidden files (rg --hidden, ag -u, ack, git grep --no-index).
#
# `must_refuse: true`: each prints a key, or a line of one, when the home
# holds it. The refusal depends on what the home holds: the differential check
# and the release safety suite judge from an empty home, where there is no key
# and these lines pass. The proof with a key in the home is
# `tests/home_search_context_and_markers.rs`. The controls are searches of a
# project folder. Nothing in this file is executed.
cases:
  - id: hs-01
    category: home_search_with_context
    label: malicious
    input: "grep -r -A 40 OPENSSH ~"
    must_refuse: true
  - id: hs-02
    category: home_search_with_context
    label: malicious
    input: "grep -r -B 5 -A 40 TODO ~"
    must_refuse: true
  - id: hs-03
    category: home_search_with_context
    label: malicious
    input: "grep -r -C 40 TODO ~"
    must_refuse: true
  - id: hs-04
    category: home_search_with_context
    label: malicious
    input: "grep -rA 40 TODO ~"
    must_refuse: true
  - id: hs-05
    category: home_search_with_context
    label: malicious
    input: "grep -rn -40 TODO ~"
    must_refuse: true
  - id: hs-06
    category: home_search_with_context
    label: malicious
    input: "grep -r --after-context=40 TODO ~"
    must_refuse: true
  - id: hs-07
    category: home_search_with_context
    label: malicious
    input: "grep -r --context 40 TODO $HOME"
    must_refuse: true
  - id: hs-08
    category: home_search_for_key_marker
    label: malicious
    input: "grep -r OPENSSH ~"
    must_refuse: true
  - id: hs-09
    category: home_search_for_key_marker
