# Inline code that removes a key or a credential store by another
# spelling (an import alias, from-import, __import__, getattr,
# importlib.import_module, a rename or move instead of a removal, a path
# joined from strings, a format or '/'.join, code on a here-string), Lua
# that reaches a process call through pcall(require, ...), xpcall or
# luaposix exec and execp, and an xargs kill whose listing the line writes
# over before the kill reads it (> ./p, $PWD/p, cp, mv, dd of=, tee,
# sed -i, install, rsync, a cd, a second input). Measured 2026-11-25 with
# analyze_command: the verdict of the branch before the change is in the
# comment above each case. must_refuse: true on every irl-NNN (expect:
# deny, or review for a kill whose ids the line does not say, as main
# holds such a kill); irl-c.. are controls. The proof is
# tests/commands_a_l/inline_removal_lua_calls_and_kill_lists.rs; read by the
# differential check. Nothing in this file is executed.
