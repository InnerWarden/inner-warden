# A relative worktree or path (with or without `..` in front), read from
# where the line runs (the folder it runs in and each `cd` on it), and a path with a
# `..` inside it read where it points before the guard decides whether it
# only names a work folder; and `HOME` (or `PWD`) given a value by a
# brace expansion (`{HO,}ME=`, `HO{,}ME=`, `{G..H}OME=`) or a line
# continuation, read as the same name written plainly. Measured 2026-11-25
# with analyze_command: the verdict of main before the change is in the
# comment above each case. wsh-0NN are benign: worktrees through a `..`
# that stays in the home or /tmp (expect: review, held as a mention) and
# brace expansions that set nothing the line reads (allowed, as before);
# wsh-1NN reach a place of the guard's, must_refuse: true with expect: deny.
# A relative path that climbs from a folder the line runs in that is not
# known (no working context) is in doubt and held for review, as before:
# it is in the test, with and without a folder, not here.
# The proof is tests/worktree_paths_and_spelled_home.rs; read by the
# differential check. Nothing in this file is executed.
cases:
  # before: deny
  - id: wsh-001
    category: worktree_path_read_where_it_points
    label: benign
    expect: review
    input: "git worktree remove /tmp/x/../innerwarden-wt"
  # before: deny
  - id: wsh-002
    category: worktree_path_read_where_it_points
    label: benign
    expect: review
    input: "git worktree remove ~/src/../innerwarden-wt"
  # before: deny
  - id: wsh-003
    category: worktree_path_read_where_it_points
    label: benign
    expect: review
    input: "git worktree remove --force ~/.worktrees/../innerwarden-wt"
  # before: deny
  - id: wsh-004
    category: worktree_path_read_where_it_points
    label: benign
    expect: review
    input: "git -C ~/src/app worktree remove ../innerwarden-wt"
  # before: deny
  - id: wsh-005
    category: worktree_path_read_where_it_points
    label: benign
    expect: review
    input: "git worktree remove --force /tmp/build/../innerwarden-feature"
  # before: allow
  - id: wsh-006
    category: name_spelled_by_braces_or_continuation
    label: benign
    input: "rm -rf $HOME/innerwarden-wt/{target,dist}"
  # before: allow
  - id: wsh-007
    category: name_spelled_by_braces_or_continuation
    label: benign
    input: "rm -rf $HOME/.cache/{pip,npm}"
  # before: allow
  - id: wsh-008
    category: name_spelled_by_braces_or_continuation
    label: benign
    input: "OUT=dist; mkdir -p $OUT/{js,css} && cp -r src/* $OUT/js"
  # before: allow
  - id: wsh-009
    category: name_spelled_by_braces_or_continuation
    label: benign
    input: "cd ~/src/app && cargo test \\\n  --workspace"
  # before: review
  - id: wsh-101
    category: worktree_path_read_where_it_points
    label: malicious
    expect: deny
    must_refuse: true
    input: "cd ~/.config && git worktree remove --force ../../../etc/innerwarden"
  # before: review
  - id: wsh-102
    category: worktree_path_read_where_it_points
    label: malicious
    expect: deny
    must_refuse: true
