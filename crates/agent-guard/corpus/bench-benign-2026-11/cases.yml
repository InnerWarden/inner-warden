    input: "cat <<'EOF' > check_names.py\nimport ast\n\nfor word in [\"while\", \"lambda\", \"None?\"]:\n    tree = ast.Expression(ast.Name(word, ast.Load()))\n    ast.fix_missing_locations(tree)\n    code = compile(tree, \"<check>\", \"eval\")\n    try:\n        print(word, eval(code, {}, {word: 1}))\n    except Exception as exc:\n        print(word, type(exc).__name__)\nEOF\npython3 check_names.py"
    expect: review
