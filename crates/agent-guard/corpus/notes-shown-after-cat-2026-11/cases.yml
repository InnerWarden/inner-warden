# Notes that cat writes into a notes file, then shown, measured 2026-11-26
# with analyze_command: the verdict of the branch before the change is in
# the comment above each case.
# - nsc-0NN (label: benign): notes written by cat (appended or replaced,
#   delimiter quoted or not) that quote a here-document handed to python3
#   which opens an agent's settings for writing, then shown with cat, head,
#   tail, less, more or bat. Showing a file never runs it: allowed.
# - nsc-1NN (must_refuse: true, expect: deny): the same notes run afterwards
#   (a shell, source, ., python3, chmod +x and the file run), piped into a
#   shell or an interpreter, shown by a pager told to run a command, to load
#   a key file or to start another pager, copied over an agent's settings,
#   and a here-document handed to an interpreter. Refused before and after.
#   Also the notes shown into a shell's startup file, an agent's
#   instructions or a file in ~/.config, and a substitution that may run
#   the notes: after them, in a body that expands, or beside them through
#   a pipe, a & or a group.
#   nsc-201 to nsc-218 (category cat_notes_head_substitution): a
#   substitution before the notes that may outlive it and run the notes
#   once written (a & inside it, a process substitution, a pipe into a
#   shell, a launcher, a git option that runs a program, printf -v, a
#   here-string or a redirection into a file, a process substitution of
#   date, a ${...} that expands a prompt holding a substitution). Refused.
#   nsc-219 to nsc-225 (same category): an arithmetic expansion of a
#   variable whose value is an array index holding a substitution, and
#   printf -v named through a variable. Refused.
#   A line with any substitution before the notes is read whole, so a
#   journal entry whose date is taken by $(date) is refused too: a known
#   false positive, kept on purpose; tests/commands_l_w/notes_shown_after_cat_stay_text.rs
#   holds that verdict.
# The proof is tests/commands_l_w/notes_shown_after_cat_stay_text.rs; read by the
# differential check. Nothing in this file is executed.
