# The guard's units, configuration and program removed, moved or edited
# through a path the line does not spell out whole: a pattern
# (innerwarden*, inner*.service, [i]nnerwarden, ?), a doubled or dotted
# folder (//, /./), a name relative to a cd or pushd of the line, a whole
# folder that holds one (rm -rf ~/.config/systemd/user, mv
# /etc/systemd/system x), find with -delete or -exec rm and a -name that
# can match one, and the editors of its files by pattern, by cd or by
# their own command (vim -c 'e FILE', vim +'e FILE', emacs --batch, ruby
# -i). Measured 2026-11-25 with analyze_command: the verdict of main
# 542cc8c is in the comment above each case; none was a deny.
# must_refuse: true with expect: deny on every gft-NNN; gft-c.. are
# controls (another program's unit, a pattern that cannot match a name of
# the guard, a quoted pattern, a move into a folder of the guard that
# replaces nothing of it, a relative name with no folder known). The proof
# is tests/guard/guard_files_through_patterns_and_folders.rs; read by the
# differential check. Nothing in this file is executed.
