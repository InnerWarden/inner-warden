# SQL handed to a SQL client that runs inside a container or on another
# host: docker exec, podman exec, kubectl exec ... -- and the remote line of
# ssh, with the client named after them (psql, sqlite3, mysql, mariadb,
# duckdb), by -c, -e, a positional argument, a here-document, a here-string
# or a pipe from echo. Measured 2026-11-25 with analyze_command: the verdict
# of the branch before the change is in the comment above each case. The
# srn-0NN cases are the lines sessions write into a database, an INSERT or
# UPDATE whose string names the guard (benign); srn-1NN are what the client
# or the runner runs as a shell (a backslash command, a dot command, system,
# COPY ... PROGRAM, sh -c, a second command on the line, a pager, a
# substitution), must_refuse: true with expect: deny. The proof is
# tests/commands_l_w/sql_through_container_and_ssh.rs; read by the differential check.
# Known limit, not read: SQL that is data on the line can still reach a
# shell through what the database already holds (a trigger or a user
# function on the table, plsh and the like); the line does not show it,
# the same as for the client run here.
# Nothing in this file is executed.
