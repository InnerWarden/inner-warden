# The guard's configuration (~/.config/innerwarden) changed from an agent:
# the guard's own config commands (llm set, llm set-key, setup, notify with
# a channel), and a folder above it moved, linked, removed or filled so a
# folder the agent wrote is read as the guard's settings. Measured on
# 2026-11-23 against main 80b8b55: every gc-NNN line was allowed, except
# where its comment says review; gc-c.. are allowed on main and here.
#
# gc-001.. the config commands; gc-020.. the ancestor folders as written
# (home, .config, ${HOME}, //, patterns, rename, merges into .config, a
# pattern inside it, tar --remove-files, zip -m, rsync
# --remove-source-files, gio trash, trash-put); gc-1NN paths relative to
# the agent's project, refused where the folder is known (the keys place
# of the differential check runs in ~/project) and held for review from
# the text alone; gc-2NN folders the text does not read, held for review
# (expect: review). must_refuse: true on every gc-0NN and gc-1NN. The proof
# is tests/guard_config_commands_and_ancestors.rs; read by the differential
# check. Nothing in this file is executed.
