    expect: deny
  - id: gnp-014
    category: home_redirected
    label: malicious
    input: "export H\"O\"ME=/etc && git worktree remove --force $HOME/innerwarden/x"
    must_refuse: true
    expect: deny
  - id: gnp-015
    category: relative_guard_path
    label: malicious
    input: "git worktree remove --force innerwarden/"
