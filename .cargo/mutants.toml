# cargo-mutants settings, read by every run of it in this repo (the nightly
# diff shards and the Sunday sweep in .github/workflows/nightly-deep.yml, and
# a local `cargo mutants`). They change how the tree is built for mutation
# testing only; `cargo build` and `cargo test` are untouched.
#
# WHY THE DEPENDENCIES ARE OPTIMISED. On 2026-11-27 the unmutated test run of
# innerwarden-agent-guard took 355 s on the runner (86 s on 2026-11-09), and
# the nightly diff job ran out of its 75 minutes every night from 2026-11-19.
# Measured on an 8-core box, every test binary run on its own (135 binaries,
# 2,884 tests, 4 test threads):
#
#   as built today (engine at opt-level 2, dependencies at 0)   207 s
#   the same with the dependencies at opt-level 3                58 s
#
# The time was not in the tests of the engine but in the regex, YAML and
# tree-sitter code they call, unoptimised: most of the 135 binaries spend
# about a second compiling rule sets before their first assertion. The
# dependencies are built once per run, so optimising them costs nothing per
# mutant. The engine keeps its opt-level 2 (Cargo.toml says why); at 0 its
# rebuild per mutant is cheaper but its tests are slower, and on the same 25
# mutants of 2026-11-24 (4 cores, -j 2) the run tested 17 in 30 minutes,
# against all 25 in 29.5 minutes this way.
#
# No test suite is left out: a mutant in code only one suite checks would then
# read as a survivor, and the run is under the budget without that.
#
# Debug info is off: nothing reads a backtrace here, and linking 135 test
# binaries per mutant costs less without it.
additional_cargo_args = [
  "--config=profile.dev.package.\"*\".opt-level=3",
  "--config=profile.dev.debug=0",
]

# The per-mutant timeout is three times the unmutated run (the workflow passes
# --timeout-multiplier 3). With the faster baseline that is under three
# minutes, and the slowest surviving mutant of the sample above ran 99 s of
# tests beside another mutant's build; a busy runner could push a slow
# survivor past it and report a hang that is not one. A real hang still times
# out, five minutes in, and still fails the job.
minimum_test_timeout = 300

# Mutants that change nothing a caller can see, each with why. A regex names
# one mutant by its place: a change that moves the line drops the exclusion
# and the mutant is tested again (and reported again, until the regex is
# moved with it); it never hides another mutant.
exclude_re = [
  # A text over 64 bytes is no address, and neither is one of exactly 64:
  # four parts of at most 13 bytes and three dots make 55.
  'mcp_proxy/taint\.rs:1562:38: replace > with >= in inet_aton',
  # Past the room, the check after decoding stops it too: this one spares the decoding.
  'mcp_proxy/taint\.rs:690:56: replace > with == in TaintTracker::note_call',
  # At the room to the byte, the check after decoding stops it: it keeps a token or more.
  'mcp_proxy/taint\.rs:690:56: replace > with >= in TaintTracker::note_call',
  # The word at `index` is the `-c` flag (or a flag group holding `c`):
  # `shell_c_script_from` steps over it as over any option, so starting
  # there or one word later finds the same script.
  'src/shell\.rs:13365:52: replace \+ with \* in shell_code_input',
  'src/threats\.rs:24258:67: replace \+ with \* in shell_interpreter_executes_target',
  # The only caller reads whether a client was found, never its words.
  'src/shell\.rs:14130:29: replace \+ with \* in sql_client_words',
  # `index * 1` adds only the command word to its own arguments, and that
  # word is the name the arm matched (`cd`, `pushd`, `popd`): never `-`, and
  # never a path that starts with `/`, so no arm answers otherwise.
  'src/private_temp\.rs:61:38: replace \+ with \* in leaves_no_named_directory',
  # The answer off unix, where no owner or mode is read. Never built where
  # the mutants run (Linux), so no test there can reach it; the unix one is
  # the one tested.
  'src/private_temp\.rs:198:5: replace is_private -> bool with true',
  # A word that starts `--` starts its letters with `-`, so the letters
  # before an `o` hold that `-` and are never all letters and digits: the
  # arm of a long option and the arm of a short one answer the same.
  "threats/program_places\\.rs:388:34: replace match guard !letters\\.starts_with\\('-'\\) with true in ssh_local_commands",
  # `words[at * 1..]` adds the program word to its operands, and that word
  # is plain: `operand_names_guard_program` never takes a plain word.
  'threats/guard_file_targets\.rs:575:38: replace \+ with \* in found_guard_program_changed',
  # `texts[at * 1..]` adds the program word (`scp`, `sftp`) to its own
  # arguments, and a program's name is no `-o` setting.
  'threats/program_places\.rs:446:41: replace \+ with \* in ssh_local_commands_of',
  # The `;` that ends what `fd -x` runs is looked for from the word after
  # `-x`; from `-x` itself (`exec * 1`) the first word read is `-x`, which is
  # no `;`, and the end found is the same.
  'threats/program_places\.rs:565:33: replace \+ with \* in fill',
  # The word at `agent` says `agent`, not `kernel`: the first `kernel` from
  # it on is the first from the word after it.
  'threats/words_after\.rs:585:33: replace \+ with \* in WordsAfter::kernel_verbs_written_after',
  # `before[first * 1]` keeps the name itself at the head of the words read
  # for a verb, and a name of the guard is never one of the verbs read
  # (`allow`, `mute`, `monitor`, `dry-run`, `uninstall`).
  'src/threats\.rs:7220:52: replace \+ with \* in guard_cli_named_later_loosens',
  # Past the first answer, a word not shown whole that names a guard
  # program by its last part is one to `guard_program` already, and its
  # glued value names none otherwise: going on to read it answers the same.
  'src/threats\.rs:5089:66: replace \|\| with && in guard_program_or_glued',
  'src/threats\.rs:5089:46: replace \|\| with && in guard_program_or_glued',
  # An assignment word with an expansion spelled as a command line is that
  # assignment again, and its value is read as text kept to run later where
  # the line gives it (`runs_text_of`): spelling it finds nothing more.
  'src/threats\.rs:5699:13: replace \|\| with && in command_lines_spelled',
  # The word at `assigns_to` is the program a command runs, never a
  # `NAME=value`: taking it among the assignments changes nothing.
  'src/threats\.rs:4743:30: replace < with <= in guard_words_found_within',
  # A substitution read at the level of the text around it is read again at
  # each level of the substitutions nested in it: a line of nested
  # substitutions is then read past the per-mutant timeout. The run reports
  # it as a timeout, never as a wrong answer, and the level is held by
  # `the_levels_of_store_reads_and_removals_end_past_the_last_one`.
  'src/threats\.rs:22406:50: replace \+ with \* in runs_a_removal',
  # `aside` is set only where a word holds the guard's letters, and
  # `letters` holds them for the whole text: a construct beside it is held
  # either way, so dropping or flipping `aside` changes no answer.
  'guard_doubt/rules\.rs:1222:20: replace \|= with \^= in Judge::context',
  'guard_doubt/rules\.rs:1222:20: replace \|= with &= in Judge::context',
  'guard_doubt/rules\.rs:1261:23: replace \|\| with && in Judge::doubt',
  'guard_doubt/rules\.rs:1261:36: replace \|\| with && in Judge::doubt',
  'guard_doubt/rules\.rs:1165:19: replace \|= with \^= in name_places',
  'guard_doubt/rules\.rs:1165:19: replace \|= with &= in name_places',
  'guard_doubt/rules\.rs:1179:19: replace \|= with \^= in name_places',
  # A value read in place of `$NAME` whose rest holds an expansion keeps that
  # expansion in the word it makes, which is read as a command word not
  # shown whole either way.
  'guard_doubt/rules\.rs:1238:13: replace \|\| with && in Judge::resolved',
]
