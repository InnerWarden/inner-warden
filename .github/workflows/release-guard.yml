name: Release InnerWarden Community

# Builds the free Community binary (`innerwarden`, crate `cli`) for Linux,
# macOS, and Windows on x86_64 + aarch64, signs each with Ed25519, and publishes
# to the ROLLING `iw-guard` release on InnerWarden/innerwarden-releases so the
# install one-liner always resolves the freshest binary:
#   curl -fsSL https://innerwarden.com/free | sh
#
# Split of responsibility:
#   - inner-warden          (this repo): the SOURCE. Builds the binary.
#   - innerwarden-releases  : DISTRIBUTION. Holds the installers, the Scoop
#                             manifest, and the public key. This job reads the
#                             installer from there, stamps the fresh pinned key,
#                             publishes the binaries, and commits the updated
#                             installer/manifest/key back.
#
# Trigger: workflow_dispatch, or a `guard-v*` tag for a named cut.
#
# Required repo secrets:
#   RELEASE_SIGNING_KEY  - Ed25519 private key (PEM) that signs the binaries.
#   RELEASES_REPO_TOKEN  - token with write access to InnerWarden/innerwarden-releases.

on:
  workflow_dispatch:
  push:
    tags:
      - "guard-v[0-9]+.[0-9]+.[0-9]+"
      - "guard-v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

concurrency:
  group: innerwarden-community-release
  cancel-in-progress: false

jobs:
  # The release must not be cuttable from a ref whose tests are failing.
  # `npm-publish.yml` gained this gate; the workflow that produces the SIGNED
  # BYTES did not, so the only thing between a red build and a published binary
  # was remembering to look at CI before dispatching.
  gate:
    name: CI must be green on this commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require a green CI run for ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          runs=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=20" \
            --jq '[.workflow_runs[] | select(.status=="completed")] | map(.conclusion)')
          echo "CI conclusions for $sha: $runs"
          if [ "$runs" = "[]" ]; then
            echo "::error::no completed CI run for $sha. Signing an untested commit is how a broken binary gets a signature."
            exit 1
          fi
          if ! printf '%s' "$runs" | python3 -c 'import json,sys; c=json.load(sys.stdin); sys.exit(0 if c and all(x=="success" for x in c) else 1)'; then
            echo "::error::CI is not green on $sha: $runs"
            exit 1
          fi
          echo "CI is green on $sha"

  build:
    needs: gate
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            builder: zigbuild
            targets: x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
          - os: macos-latest
            builder: cargo
            targets: x86_64-apple-darwin aarch64-apple-darwin
          - os: windows-latest
            builder: cargo
            targets: x86_64-pc-windows-msvc aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Zig + cargo-zigbuild (linux cross-link)
        if: matrix.builder == 'zigbuild'
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2
        with:
          version: 0.13.0
      - name: cargo-zigbuild
        if: matrix.builder == 'zigbuild'
        run: command -v cargo-zigbuild >/dev/null 2>&1 || cargo install cargo-zigbuild --locked

      # The AI Jail tests require a real bubblewrap binary and unprivileged user
      # namespaces: they deliberately fail rather than silently skip isolation.
      # Ubuntu 24.04 restricts unprivileged userns via AppArmor, which breaks
      # bwrap's uid map, so allow it here.
      - name: Install the Linux AI Jail backend
        if: matrix.builder == 'zigbuild'
        # Same mitigation CI carries: a fresh runner boots with
        # unattended-upgrades holding the dpkg lock, and without a lock timeout
        # this hangs until the job is killed. The release path had the bare
        # form, so the ONE build that has to succeed on demand was the flakiest.
        timeout-minutes: 8
        run: |
          sudo systemctl stop unattended-upgrades.service 2>/dev/null || true
          sudo apt-get -o DPkg::Lock::Timeout=300 update
          sudo apt-get -o DPkg::Lock::Timeout=300 install --yes bubblewrap
          test "$(command -v bwrap)" = /usr/bin/bwrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      # Pinned, like CI's dashboard job. The runner image ships SOME node, and
      # "whatever the image has today" is not a thing to depend on in the one
      # workflow that produces signed bytes.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.builder == 'zigbuild'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: crates/dashboard-kit/web/package-lock.json

      # The dashboard bundle is EMBEDDED in the binary being signed. CI checks
      # its freshness on every push; the release path did not, so the only
      # thing between a stale UI and a signed release was remembering to look
      # at CI before dispatching. Check it here, where it is about to ship.
      - name: The embedded dashboard bundle must match its sources
        if: matrix.builder == 'zigbuild'
        working-directory: crates/dashboard-kit/web
        run: |
          npm ci
          npm run bundle:check

      - name: Test the Community crates
        if: matrix.builder == 'zigbuild'
        run: cargo test -p innerwarden -p innerwarden-agent-guard -p innerwarden-dashboard-kit -p innerwarden-graph -p innerwarden-notify

      - name: Build + stage innerwarden for each target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for t in ${{ matrix.targets }}; do
            rustup target add "$t"
            echo "=== building innerwarden for $t ==="
            if [ "${{ matrix.builder }}" = "zigbuild" ]; then
              cargo zigbuild --release --target "$t" -p innerwarden
            else
              cargo build --release --target "$t" -p innerwarden
            fi
            case "$t" in
              *linux*)   os=linux;   ext="" ;;
              *darwin*)  os=macos;   ext="" ;;
              *windows*) os=windows; ext=".exe" ;;
            esac
            case "$t" in
              x86_64-*)  arch=x86_64 ;;
              aarch64-*) arch=aarch64 ;;
            esac
            src="target/$t/release/innerwarden${ext}"
            dest="dist/innerwarden-${os}-${arch}${ext}"
            cp "$src" "$dest"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$dest" | awk '{print $1}' > "${dest}.sha256"
            else
              shasum -a 256 "$dest" | awk '{print $1}' > "${dest}.sha256"
            fi
            echo "staged $dest"
          done
          ls -lh dist/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: innerwarden-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Sign + publish rolling iw-guard release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      # The installer, Scoop manifest, and public key live in the DISTRIBUTION
      # repo, not here. Read them from there, update them, publish, commit back.
      - name: Checkout the releases (distribution) repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: InnerWarden/innerwarden-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          path: public-releases

      - name: Gather assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -name 'innerwarden-*' -exec cp {} dist/ \;
          # Installer + PowerShell installer come from the distribution repo.
          cp public-releases/iw-guard-install.sh dist/iw-guard-install.sh
          cp public-releases/install.ps1 dist/install.ps1
          ls -lh dist/

      - name: Regenerate the Scoop manifest (fresh version + hashes)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x dist/innerwarden-linux-x86_64
          ver="$(./dist/innerwarden-linux-x86_64 --version | awk '{print $NF}')"
          # A `guard-v1.1.0` tag cut from a tree that still says 1.0.7 would
          # publish the new bytes labelled with the old version, to Scoop and to
          # every consumer that reads the manifest. Nothing checked.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            want="${GITHUB_REF_NAME#guard-v}"
            [ "$ver" = "$want" ] || {
              echo "::error::tag $GITHUB_REF_NAME does not match the built binary, which reports $ver"
              exit 1
            }
          fi
          h64="$(awk '{print $1}' dist/innerwarden-windows-x86_64.exe.sha256)"
          harm="$(awk '{print $1}' dist/innerwarden-windows-aarch64.exe.sha256)"
          python3 - "$ver" "$h64" "$harm" <<'PY'
          import json, sys
          ver, h64, harm = sys.argv[1:4]
          m = json.load(open("public-releases/innerwarden.json"))
          m["version"] = ver
          m["architecture"]["64bit"]["hash"] = h64
          m["architecture"]["arm64"]["hash"] = harm
          json.dump(m, open("dist/innerwarden.json", "w"), indent=2)
          PY
          echo "generated dist/innerwarden.json (version $ver)"

      - name: Sign binaries with Ed25519 and stamp the pinned key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY is required to publish the rolling Community release."
            exit 1
          fi
          echo "$RELEASE_SIGNING_KEY" > /tmp/sign-key.pem
          chmod 600 /tmp/sign-key.pem
          trap 'rm -f /tmp/sign-key.pem /tmp/sign-digest.bin' EXIT
          for binary in dist/innerwarden-*; do
            case "$binary" in
              *.sha256|*.sig|*install.sh|*.pub|*.json) continue ;;
            esac
            echo "signing $(basename "$binary")..."
            openssl dgst -sha256 -binary "$binary" > /tmp/sign-digest.bin
            openssl pkeyutl -sign -inkey /tmp/sign-key.pem -rawin -in /tmp/sign-digest.bin \
              | base64 -w 0 > "${binary}.sig"
          done
          rawb64="$(openssl pkey -in /tmp/sign-key.pem -pubout -outform DER | tail -c 32 | base64 | tr -d '\n')"
          printf -- '-----BEGIN PUBLIC KEY-----\nMCowBQYDK2VwAyEA%s\n-----END PUBLIC KEY-----\n' \
            "$rawb64" > dist/innerwarden-release.pub
          committed="$(sed -n 's|^IW_RELEASE_PUBKEY_B64="\${IW_GUARD_PUBKEY:-\([A-Za-z0-9+/=]*\)}".*|\1|p' dist/iw-guard-install.sh | head -1)"
          if [ -n "$committed" ] && [ "$committed" != "$rawb64" ]; then
            echo "::error::iw-guard-install.sh pins a public key that does not match the signing key."
            exit 1
          fi
          sed -i "s|\${IW_GUARD_PUBKEY:-[A-Za-z0-9+/=]*}|\${IW_GUARD_PUBKEY:-$rawb64}|" dist/iw-guard-install.sh
          grep -q "IW_GUARD_PUBKEY:-$rawb64}" dist/iw-guard-install.sh \
            || { echo "::error::failed to stamp the pinned public key into the installer"; exit 1; }
          ls dist/*.sig dist/*.pub

      - name: Verify the asset manifest
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            innerwarden-linux-x86_64  innerwarden-linux-aarch64
            innerwarden-macos-x86_64  innerwarden-macos-aarch64
            innerwarden-windows-x86_64.exe  innerwarden-windows-aarch64.exe
          )
          missing=0
          for name in "${expected[@]}"; do
            [ -s "dist/$name" ]          || { echo "MISSING: $name"; missing=1; }
            [ -s "dist/${name}.sha256" ] || { echo "MISSING: ${name}.sha256"; missing=1; }
            [ -s "dist/${name}.sig" ]    || { echo "MISSING: ${name}.sig"; missing=1; }
          done
          [ -s dist/innerwarden-release.pub ] || { echo "MISSING: innerwarden-release.pub"; missing=1; }
          [ -s dist/iw-guard-install.sh ]     || { echo "MISSING: iw-guard-install.sh"; missing=1; }
          [ -s dist/install.ps1 ]             || { echo "MISSING: install.ps1"; missing=1; }
          [ -s dist/innerwarden.json ]        || { echo "MISSING: innerwarden.json (scoop)"; missing=1; }
          [ "$missing" -eq 0 ] || { echo "asset manifest verification failed."; exit 1; }
          echo "All 6 binaries + sha256 + Ed25519 sigs + public key + installers + scoop manifest present."

      - name: Publish rolling iw-guard release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          repository: InnerWarden/innerwarden-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: iw-guard
          name: InnerWarden Community (rolling)
          body: |
            InnerWarden Community: the free, cross-platform AI-agent guardrail.

            ```sh
            curl -fsSL https://innerwarden.com/free | sh
            npm install -g innerwarden
            ```

            Every binary ships SHA-256 and Ed25519 sidecars; the installer verifies
            both. Rolling release: always the freshest Linux/macOS/Windows
            (x86_64 + aarch64) binary. Pin a cut with IW_GUARD_TAG=guard-vX.Y.Z.
          prerelease: false
          make_latest: false
          files: dist/*
          fail_on_unmatched_files: true

      - name: Commit updated installer, manifest, and key back to the releases repo
        shell: bash
        run: |
          set -euo pipefail
          cp dist/iw-guard-install.sh public-releases/iw-guard-install.sh
          cp dist/install.ps1 public-releases/install.ps1
          cp dist/innerwarden.json public-releases/innerwarden.json
          cp dist/innerwarden-release.pub public-releases/innerwarden-release.pub
          cd public-releases
          git config user.name "innerwarden-release-bot"
          git config user.email "release-bot@innerwarden.com"
          git add iw-guard-install.sh install.ps1 innerwarden.json innerwarden-release.pub
          if git diff --cached --quiet; then
            echo "Distribution metadata already matches this build."
          else
            git commit -m "Update InnerWarden Community release metadata"
            git push origin HEAD:main
          fi
