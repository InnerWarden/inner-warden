name: CodeQL

# Code scanning as a workflow in the repo, in place of GitHub's default setup.
# Default setup did not analyse pull requests opened from forks, and `CodeQL` is a
# required check on `main`, so every outside contribution sat unmergeable with all
# other checks green. A workflow on `pull_request` runs for fork pull requests too
# (after a maintainer approves the run for a first-time contributor).
#
# Same scope as the default setup it replaces: the default query suite over
# actions, JavaScript/TypeScript, Python and Rust, on pull requests, pushes to
# `main` and once a week.

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 4 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
