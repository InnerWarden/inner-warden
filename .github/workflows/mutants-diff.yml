name: Mutants on a diff

# The mutation run over what a diff changes in the screening engine
# (crates/agent-guard/src): one plan, the mutants split into shards, each
# shard's verdict (scripts/mutants-diff-verdict.sh) and one summary. Called by
# the nightly run (nightly-deep.yml, what changed in the last 26 hours) and by
# a manual run with a diff base. The mutants of a change are run before its
# pull request, on our own machine, so the nightly finds none left. One definition, so the
# two read the same plan and the same verdict.

on:
  workflow_call:
    inputs:
      diff_base:
        description: "Diff against this commit; empty: the newest commit older than 26 hours"
        type: string
        default: ""
      label:
        description: "What the diff is, for the plan job's name"
        type: string
        default: "what changed in the last day"

permissions:
  contents: read

jobs:
  plan:
    name: cargo-mutants plan (${{ inputs.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      mutants: ${{ steps.plan.outputs.mutants }}
      shards: ${{ steps.plan.outputs.shards }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `--in-diff` needs history to diff against; the default shallow
          # checkout has none and the diff would silently come out empty, which
          # is the failure mode where a check reports success having done nothing.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked --version ^25
      - name: What the diff changes
        id: diff
        # Computed once, here, and handed to every shard as a file: a shard
        # that started later and computed "26 hours ago" itself could diff
        # against another commit and split a different list.
        env:
          DIFF_BASE: ${{ inputs.diff_base }}
        run: |
          set -euo pipefail
          if [ -n "${DIFF_BASE:-}" ]; then
            base=$(git rev-parse --verify "${DIFF_BASE}^{commit}")
          else
            base=$(git rev-list -1 --before="26 hours ago" HEAD || true)
          fi
          if [ -z "$base" ]; then
            echo "changed=none" >> "$GITHUB_OUTPUT"
            echo "No commit older than 26 hours; nothing to diff against."
            exit 0
          fi
          git diff "$base" HEAD -- crates/agent-guard/src/ > day.diff
          if [ ! -s day.diff ]; then
            echo "changed=none" >> "$GITHUB_OUTPUT"
            echo "The screening engine did not change since $base; nothing to mutate."
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
            echo "Diffing against $base ($(wc -l < day.diff) lines)."
          fi
      - name: Count the mutants and split them
        id: plan
        if: steps.diff.outputs.changed == 'yes'
        run: |
          set -euo pipefail
          # Mutants each shard is sized for; at most twenty shards.
          per_shard=40
          max_shards=20
          cargo mutants --package innerwarden-agent-guard --in-diff day.diff --list > day-mutants.txt
          mutants=$(wc -l < day-mutants.txt)
          shards=$(( (mutants + per_shard - 1) / per_shard ))
          # No mutant in the diff (a change to tests or comments only): no
          # shard runs, and the plan says so.
          if [ "$mutants" -eq 0 ]; then
            echo "::notice::The diff changes the engine's files but holds no mutant (tests or comments only): nothing to mutate."
          fi
          [ "$shards" -le "$max_shards" ] || shards=$max_shards
          matrix=$(jq -cn --argjson n "$shards" '[range($n)]')
          {
            echo "mutants=$mutants"
            echo "shards=$shards"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"
          echo "$mutants mutants in the diff, $shards shards."
          if [ "$mutants" -gt $(( shards * per_shard )) ]; then
            echo "::warning::$mutants mutants is more than $shards shards of $per_shard are sized for: each shard tests what fits in its budget, and the summary says how many."
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.diff.outputs.changed == 'yes'
        with:
          name: mutants-diff-plan
          path: |
            day.diff
            day-mutants.txt

  mutate:
    name: cargo-mutants (did we test what we changed?) shard ${{ matrix.shard }}
    needs: plan
    if: needs.plan.outputs.changed == 'yes' && needs.plan.outputs.mutants != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false # one shard's finding must not cancel what the others test
      matrix:
        # Zero-indexed, from the plan: `--shard k/n` takes k in 0..n-1 (the
        # full sweep below says what a 1..n matrix cost).
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked --version ^25
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutants-diff-plan
      - name: Mutate this shard of what changed
        # Exit codes are read rather than swallowed. The previous `|| echo
        # warning` collapsed every non-zero into a warning, so a SURVIVING
        # MUTANT, the whole point of this job, could never fail it. They mean
        # different things and are reported differently by
        # scripts/mutants-diff-verdict.sh:
        #   0 clean · 2 mutants survived · 3 cargo-mutants timed out
        #   5|6 the diff does not apply · 124 the shard budget ran out, and
        #   then what was tested decides · anything else is a real error
        # The per-mutant timeout is three times the unmutated test run, not a
        # fixed 120s: on 2026-11-09 the baseline took 86s on this runner, and a
        # mutant no test catches runs the whole suite, so one that ran a little
        # slow at -j 2 was reported as a timeout instead of a survivor (run
        # 42585938875). .cargo/mutants.toml keeps it at five minutes at least.
        # A real hang still times out, and still fails the job.
        #
        # The budget ends cargo-mutants with an interrupt, which it handles by
        # stopping the test runs and keeping mutants.out/outcomes.json as it
        # stood: that file is what the verdict counts.
        #
        # Each test binary runs under an address-space cap
        # (scripts/mutants-test-runner.sh): a mutant that allocates without
        # end then fails its own test run instead of killing the runner. The
        # full sweep below says why; the log check proves the cap was on.
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.plan.outputs.shards }}
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          export "CARGO_TARGET_$(printf '%s' "$triple" | tr 'a-z-' 'A-Z_')_RUNNER=$GITHUB_WORKSPACE/scripts/mutants-test-runner.sh"
          export MUTANTS_TEST_RUNNER_LOG="$RUNNER_TEMP/mutants-test-runner.log"
          export IW_NO_WALL_CLOCK_CEILINGS=1 # see WALL-CLOCK CEILINGS on the full sweep
          export TMPDIR="${{ runner.temp }}" # see TEMPORARY FOLDER on the full sweep
          planned=$(cargo mutants --package innerwarden-agent-guard --in-diff day.diff \
            --shard "$SHARD/$SHARDS" --list | wc -l)
          set +e
          timeout --signal=INT --kill-after=2m 75m cargo mutants --package innerwarden-agent-guard \
            --in-diff day.diff --shard "$SHARD/$SHARDS" --timeout-multiplier 3 -j 2
          code=$?
          set -e
          if jq -e '.outcomes | any(.scenario == "Baseline")' mutants.out/outcomes.json >/dev/null 2>&1 \
            && [ ! -s "$MUTANTS_TEST_RUNNER_LOG" ]; then
            echo "::error::The tests ran but no test binary ran under the memory cap: cargo did not use scripts/mutants-test-runner.sh, so a runaway mutant could still kill the runner."
            exit 1
          fi
          bash scripts/mutants-diff-verdict.sh "$code" mutants.out "$planned" "Shard $SHARD/$SHARDS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-report-diff-shard-${{ matrix.shard }}
          path: mutants.out/

  summary:
    name: cargo-mutants (tested X of Y)
    needs: [plan, mutate]
    if: always() && needs.plan.outputs.changed == 'yes' && needs.plan.outputs.mutants != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutants-report-diff-shard-*
          path: reports
      - name: How much of the day's diff was tested
        run: |
          bash scripts/mutants-diff-summary.sh reports \
            "${{ needs.plan.outputs.mutants }}" \
            "${{ needs.plan.outputs.shards }}"
