name: CI

# Least privilege (audit CI-11): CI reads the code and nothing else. A workflow
# with the default token can write to the repo, which CI has no reason to do.
permissions:
  contents: read

# Audit CI-15: a new push supersedes the run it replaces, instead of both
# finishing and burning a runner on a commit nobody is waiting for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  # Manual dispatch: during the 2026-08-06 GitHub Actions incident the push
  # webhook dispatch was swallowed for hours while manual dispatches worked,
  # leaving green code unmergeable for lack of a trigger. This is the lever.
  workflow_dispatch:

jobs:
  build:
    name: build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Install bubblewrap (Linux AI Jail backend)
        if: runner.os == 'Linux'
        # Budget: 120s lock wait + 3 attempts x 60s lock + backoff is under
        # five minutes. The previous 8 was SHORTER than the retry loop it
        # contained, so a slow first attempt killed the job mid-retry.
        timeout-minutes: 12
        run: |
          # A fresh runner boots with unattended-upgrades holding the dpkg/apt
          # lock. Stopping the SERVICE is not enough: it does not kill the
          # apt-get it already spawned, and the apt-daily timers relaunch it
          # underneath us. Two PRs failed here on 2026-08-19 with the step
          # timing out after eight minutes, twice each, on a change that touched
          # no CI code at all.
          #
          # So: stop the timers as well as the services, wait for the lock to be
          # genuinely free rather than hoping a timeout covers it, and retry the
          # install, because a transient mirror error should cost a retry rather
          # than a whole run.
          sudo systemctl stop \
            unattended-upgrades.service \
            apt-daily.service apt-daily-upgrade.service \
            apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true

          # Wait for whatever already holds the lock to finish, rather than
          # racing it. 120s is generous for a runner's boot-time upgrade.
          for _ in $(seq 1 60); do
            if ! sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 \
               && ! sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          apt_retry() {
            for attempt in 1 2 3; do
              # `timeout` bounds the ATTEMPT in wall-clock. DPkg::Lock::Timeout
              # only bounds waiting for the dpkg lock, and the observed hang was
              # not the lock: apt printed the mirrorlist and then sat on a mirror
              # fetch for twelve minutes until the step budget killed it. The
              # network timeouts below make apt give up on a dead mirror; the
              # outer `timeout` is the backstop for everything else.
              if timeout 150 sudo apt-get \
                   -o DPkg::Lock::Timeout=60 \
                   -o Acquire::http::Timeout=20 \
                   -o Acquire::https::Timeout=20 \
                   -o Acquire::Retries=2 \
                   "$@"; then
                return 0
              fi
              echo "apt-get $* failed (attempt $attempt); retrying" >&2
              sleep $((attempt * 5))
            done
            return 1
          }

          # Try the cheapest path first. The runner image often already has
          # bwrap, and when it does not, the package lists it shipped with are
          # usually enough to install it. `apt-get update` is the step that
          # actually hangs: on 2026-08-19 all three bounded attempts burned their
          # full 150s against the same mirror. Refreshing the lists is a
          # nice-to-have; having bwrap is the requirement.
          if ! command -v bwrap >/dev/null 2>&1; then
            apt_retry install -y bubblewrap \
              || { apt_retry update && apt_retry install -y bubblewrap; }
          fi
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor;
          # the AI Jail backend needs them for its uid map. Allow them in CI.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      # Full suite (unit + integration) on Linux and macOS, the first-class
      # platforms.
      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --workspace

      # Windows used to run fmt + clippy only, on the reasoning that the platform
      # is experimental and its file-write integration has rough edges (audit
      # TEST-06). But the project SIGNS AND PUBLISHES Windows binaries, so
      # "experimental" described the confidence, not the exposure: users were
      # installing bytes whose test suite had never executed on their OS.
      #
      # So the suite now runs on Windows and reports. It does not gate the build
      # yet, because the known-rough integration cases would block unrelated
      # work, but a failure is visible here instead of being discovered by
      # whoever installed the package. Remove `continue-on-error` once the
      # file-write cases pass, and delete this note with it.
      #
      # Bounded, because the first run of this step showed why it has to be.
      # Windows had only ever run fmt + clippy here (1-2 minutes). The moment
      # the suite actually ran, the step passed 35 minutes with no output and
      # was still going: something in it does not terminate on Windows. Without
      # a bound that is a six-hour job holding a release, and the "reported"
      # in this step's name becomes a lie, because a job that never finishes
      # reports nothing at all.
      #
      # continue-on-error means a timeout is recorded and visible without
      # blocking the build, which is the same contract as a test failure here.
      - name: Test (Windows, reported and not yet gating)
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 25
        run: cargo test --workspace

      # The wrapper must ask for the platform packages it ships with.
      #
      # These pins were hand-maintained and drifted to 1.0.3 while the wrapper was
      # published as 1.0.4 and then 1.0.5, so `npm i -g innerwarden` resolved the new
      # version and installed the old binary. Two releases of guard fixes reached
      # nobody, and the registry dist-tag reported success both times.
      # Audit CI-10: the check below proved the npm package is internally
      # consistent, and nothing tied it to the Rust workspace. The two drifted
      # (npm 1.0.6 against workspace 1.0.7), so the channel a user installs from
      # can lag the version the code claims to be, silently.
      - name: npm package version matches the Rust workspace
        if: runner.os == 'Linux'
        run: |
          node -e '
            const fs = require("fs");
            const npm = require("./npm/package.json").version;
            const toml = fs.readFileSync("Cargo.toml", "utf8");
            const m = toml.match(/^\s*version\s*=\s*"([^"]+)"/m);
            if (!m) { console.error("could not read the workspace version"); process.exit(1); }
            if (m[1] !== npm) {
              console.error(
                "version drift: Cargo workspace is " + m[1] + ", npm/package.json is " + npm +
                ". The npm channel would ship a version the code does not claim to be."
              );
              process.exit(1);
            }
            console.log("npm and workspace agree on " + npm);
          '

      - name: npm optionalDependencies match the package version
        if: runner.os == 'Linux'
        run: |
          node -e '
            const p = require("./npm/package.json");
            const bad = Object.entries(p.optionalDependencies || {})
              .filter(([, v]) => v !== p.version);
            if (bad.length) {
              console.error(
                "npm/package.json is " + p.version + " but pins " +
                bad.map(([n, v]) => n + "@" + v).join(", ")
              );
              process.exit(1);
            }
            console.log("optionalDependencies all pinned to " + p.version);
          '

  # The Community dashboard bundle. Nothing ran the web suite or checked the
  # committed `dist/` before: a source change with no rebuild shipped a stale UI
  # and 91 unit tests gated nothing.
  #
  # `bundle:check` recomputes the SOURCE digest and compares it to the committed
  # manifest, so a stale bundle is caught without needing vite to produce
  # byte-identical output on a different machine. `bundle:reproducible` is the
  # separate guard that the output does not depend on whether a previous build
  # was on disk.
  dashboard-web:
    name: Dashboard bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/dashboard-kit/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: crates/dashboard-kit/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Unit tests
        run: npx vitest run

      - name: Manifest self-test
        run: npm run test:bundle

      - name: Committed bundle must match its sources
        run: npm run bundle:check

      - name: Bundle must not be built out of its own output
        run: npm run bundle:reproducible

      # DD audit D19. Twelve journey specs existed and none of them had ever run
      # here: `grep playwright .github/workflows/` came back empty. Worse, the
      # Rust journey contract accepted a spec file CONTAINING the string `test(`
      # as "executable evidence" that the journey passes, so an entirely broken
      # journey satisfied the contract as long as the file parsed as a test.
      #
      # Only the Community specs run. The enterprise ones belong to the paid
      # bundle and are not built here.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Browser journeys
        run: npx playwright test tests/community

  # Audit SUP-02 / CI-07: the repo had no supply-chain gate. This is it. It runs
  # on every push, so an advisory or an incompatible licence fails a PR instead
  # of being found in a quarterly review.
  # Coverage (DD audit D16).
  #
  # This repo had no instrumentation of any kind. Mutation testing existed but
  # covered `agent-guard` alone and gated nothing, so `cli` — the updater, the
  # release verifier, 16.8k lines — had none at all. That is the crate whose
  # defects replace the binary a user is running, and on 2026-08-21 one did.
  #
  # The floor lives in .tarpaulin.toml and is measured, not chosen: 79.42% on the
  # day it was added, floor at 75.
  #
  # Pull requests only, like the paid repo: this is a gate on a change rather
  # than a metric anybody reads afterwards.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # The llvm engine needs source-based coverage tools, and this list is
          # additive to the default profile, which does not carry them.
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install cargo-tarpaulin
        # Pinned to the major this config was measured against.
        run: cargo install cargo-tarpaulin --locked --version ^0.37

      - name: Measure, and fail under the floor
        # `--engine llvm` on the COMMAND LINE, not only in .tarpaulin.toml.
        # That is how the paid repo invokes it on the same runner image, and it
        # matters: on Linux the default engine is ptrace, which is the one that
        # struggles with tests that fork and exec. This job failed twice with
        # `Error: "Test failed during run"` and no failing test named while the
        # config alone carried the engine key.
        run: cargo tarpaulin --engine llvm --skip-clean --out Xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tarpaulin-coverage
          path: cobertura.xml
          if-no-files-found: ignore

  supply-chain:
    name: supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install cargo-deny
        # Pinned to the MAJOR the deny.toml was written and validated against.
        # ^0.16 was pinned without being run: 0.16 does not accept this config
        # schema, so the gate failed on its first CI run for a reason that had
        # nothing to do with the dependencies it exists to check.
        run: cargo install cargo-deny --locked --version ^0.20
      - name: Advisories, licences, bans and sources
        run: cargo deny check

  # Audit CI-02 / SUP-05: the packaging verifier is what stops unverified bytes
  # entering npm and the .deb/.rpm. It must not be able to rot unnoticed.
  packaging-verifier:
    name: packaging verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verifier unit tests
        run: node npm/scripts/verify-release-asset.test.mjs
      - name: Prove it against a REAL published artifact
        # Downloads a genuine release asset with its sidecars, verifies it, and
        # asserts a one-byte change is refused. Exercises the production key and
        # the digest-signing assumption without publishing anything.
        run: |
          set -euo pipefail
          REL=https://github.com/InnerWarden/innerwarden-releases/releases/download/iw-guard
          A=innerwarden-linux-x86_64
          mkdir -p /tmp/rv
          for f in "$A" "$A.sha256" "$A.sig"; do curl -fsSL -o "/tmp/rv/$f" "$REL/$f"; done
          node npm/scripts/verify-release-dir.mjs /tmp/rv "$A"
          printf '\0' >> "/tmp/rv/$A"
          if node npm/scripts/verify-release-dir.mjs /tmp/rv "$A"; then
            echo "::error::the verifier accepted a tampered artifact"; exit 1
          fi
          echo "tampered artifact correctly refused"
