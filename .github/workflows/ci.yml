name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install bubblewrap (Linux AI Jail backend)
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          # The fresh runner boots with unattended-upgrades holding the dpkg/apt
          # lock; wait it out with a lock timeout and disable the background job
          # so the install can't hang indefinitely.
          sudo systemctl stop unattended-upgrades.service 2>/dev/null || true
          sudo apt-get -o DPkg::Lock::Timeout=300 update
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor;
          # the AI Jail backend needs them for its uid map. Allow them in CI.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      # Full suite (unit + integration) on Linux and macOS, the first-class
      # platforms. On Windows we run fmt + clippy above (which compile the whole
      # workspace) as a build check; Windows is experimental and its file-write
      # integration (hook auto-install, config replace) still has rough edges,
      # so its test run does not gate the build yet.
      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --workspace

      # The wrapper must ask for the platform packages it ships with.
      #
      # These pins were hand-maintained and drifted to 1.0.3 while the wrapper was
      # published as 1.0.4 and then 1.0.5, so `npm i -g innerwarden` resolved the new
      # version and installed the old binary. Two releases of guard fixes reached
      # nobody, and the registry dist-tag reported success both times.
      - name: npm optionalDependencies match the package version
        if: runner.os == 'Linux'
        run: |
          node -e '
            const p = require("./npm/package.json");
            const bad = Object.entries(p.optionalDependencies || {})
              .filter(([, v]) => v !== p.version);
            if (bad.length) {
              console.error(
                "npm/package.json is " + p.version + " but pins " +
                bad.map(([n, v]) => n + "@" + v).join(", ")
              );
              process.exit(1);
            }
            console.log("optionalDependencies all pinned to " + p.version);
          '
