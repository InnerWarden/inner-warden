name: Linux packages (.deb / .rpm)

# Least privilege (audit CI-11).
permissions:
  contents: read

concurrency:
  group: linux-packages-${{ github.ref }}
  cancel-in-progress: false

# Build the Community CLI Debian and RPM packages for amd64 and arm64 from the
# prebuilt release binaries, prove they install and run on real distros, and
# upload them as artifacts. Version defaults to npm/package.json.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package (defaults to npm/package.json)"
        required: false
        default: ""

  # A release is one act, but it had three triggers: the tag published the
  # binaries, and the Linux packages and npm each waited for a human to
  # remember them separately. Nobody remembers a step that has no trigger. The
  # channel rotted 1.0.3-behind-1.0.7 once, was fixed by publishing to the same
  # rolling release, and then rotted again the identical way (1.3.3 packages
  # under 1.3.4 binaries) because the publishing was automatic and the RUNNING
  # was not. Chain off the release workflow so one tag moves every channel.
  #
  # The version-consistency step below is what makes this safe to automate: it
  # refuses to package a version the rolling release does not actually serve.
  workflow_run:
    workflows: ["Release InnerWarden Community"]
    types: [completed]

jobs:
  build:
    runs-on: ubuntu-latest
    # A failed release must not publish packages built from whatever the
    # rolling tag happened to serve before it.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # Deliberately the DEFAULT checkout, never `workflow_run.head_sha`.
      #
      # A `workflow_run` job is privileged: it holds RELEASES_REPO_TOKEN and can
      # publish to the distribution repo. Checking out a ref carried by the
      # event and then running that commit's `packaging/` and `npm/scripts/`
      # would execute attacker-chosen code with those credentials the moment
      # anything could trigger the upstream workflow from an untrusted ref.
      # CodeQL flags it `actions/untrusted-checkout/critical`, and it is right:
      # today the only trigger is a maintainer's tag, but that is a property of
      # another file, and nobody would notice the day it changed.
      #
      # Checking out the released commit bought nothing anyway. The packages
      # wrap the PUBLISHED binaries, which are downloaded and signature-verified
      # below; only the packaging scripts come from the checkout, and those
      # should be the reviewed ones on the default branch. If the branch has
      # moved to a version the rolling release does not serve, the consistency
      # step below fails loudly rather than mispackaging.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nfpm
        # Audit SUP-12: `@latest` meant the tool that BUILDS the .deb/.rpm a user
        # installs could change under us between two runs of the same commit.
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Resolve version
        id: v
        run: |
          v="${{ inputs.version }}"
          [ -n "$v" ] || v="$(node -p "require('./npm/package.json').version")"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Download and VERIFY release binaries
        env:
          REL: https://github.com/InnerWarden/innerwarden-releases/releases/download/iw-guard
        # Audit CI-02 / SUP-05: these bytes used to be curled and packaged with
        # no check at all, so the .deb/.rpm carried whatever the endpoint served.
        # Verify the published sha256 AND the Ed25519 signature against the
        # vendored pin before packaging. Fails closed: a missing sidecar is an
        # error, never a skipped check.
        run: |
          set -euo pipefail
          mkdir -p bin
          for a in innerwarden-linux-x86_64 innerwarden-linux-aarch64; do
            curl -fsSL -o "bin/$a"        "$REL/$a"
            curl -fsSL -o "bin/$a.sha256" "$REL/$a.sha256"
            curl -fsSL -o "bin/$a.sig"    "$REL/$a.sig"
          done
          node npm/scripts/verify-release-dir.mjs bin \
            innerwarden-linux-x86_64 innerwarden-linux-aarch64

      # Verification proves the bytes are genuinely ours. It says nothing about
      # WHICH version they are, and the rolling `iw-guard` tag serves whatever
      # was cut last. Run the packages workflow before release-guard has re-cut
      # and you get a .deb labelled 1.1.0 containing the 1.0.7 binary, published
      # to the channel, with every check green. npm already refuses this
      # (npm/scripts/build.mjs); the Linux channel did not.
      - name: The published binary must BE the version being packaged
        run: |
          set -euo pipefail
          chmod +x bin/innerwarden-linux-x86_64
          got="$(./bin/innerwarden-linux-x86_64 --version | awk '{print $NF}')"
          want="${{ steps.v.outputs.version }}"
          [ "$got" = "$want" ] || {
            echo "::error::the rolling iw-guard release serves $got but this run packages $want; cut the guard release first"
            exit 1
          }
          echo "rolling release serves $got, packaging $want"

      - name: Build packages
        run: |
          packaging/build-linux-packages.sh \
            "${{ steps.v.outputs.version }}" \
            bin/innerwarden-linux-x86_64 bin/innerwarden-linux-aarch64 out

      - name: Test-install the .deb (native amd64)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y "./out/innerwarden_${{ steps.v.outputs.version }}_amd64.deb"
          got="$(innerwarden --version | awk '{print $NF}')"
          [ "$got" = "${{ steps.v.outputs.version }}" ] || {
            echo "::error::the installed .deb reports $got, not ${{ steps.v.outputs.version }}"
            exit 1
          }
          echo "deb -> $got"

      - name: Test-install the .rpm (Rocky Linux container)
        run: |
          docker run --rm -v "$PWD/out:/pkg" rockylinux:9@sha256:d644d203142cd5b54ad2a83a203e1dee68af2229f8fe32f52a30c6e1d3c3a9e0 bash -c \
            "set -e
             dnf install -y /pkg/innerwarden-${{ steps.v.outputs.version }}-1.x86_64.rpm >/dev/null
             got=\$(innerwarden --version | awk '{print \$NF}')
             [ \"\$got\" = '${{ steps.v.outputs.version }}' ] || { echo \"the installed .rpm reports \$got\"; exit 1; }
             echo \"rpm -> \$got\""

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages
          path: |
            out/*.deb
            out/*.rpm

      # Publish to the SAME rolling release the binaries go to. Without this the
      # packages only ever existed as CI artifacts, so `dnf`/`apt` users stayed on
      # whatever version someone last uploaded by hand — the channel silently
      # rotted three releases behind the binaries (1.0.3 vs 1.0.7). The packages
      # are published only AFTER both test-installs above pass, so a broken
      # package can never reach the channel.
      - name: Checksums
        run: |
          cd out
          for f in *.deb *.rpm; do sha256sum "$f" > "$f.sha256"; done
          ls -la

      - name: Publish packages to the rolling iw-guard release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          gh release upload iw-guard out/*.deb out/*.rpm out/*.sha256 \
            --repo InnerWarden/innerwarden-releases --clobber
          echo "published packages for ${{ steps.v.outputs.version }}"
