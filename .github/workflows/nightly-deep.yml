name: Nightly deep checks

# Audit TEST-05 / CI-17: the repo had no lane for the checks that are too slow
# for every push. Without one they are never run at all, which is how undefined
# behaviour and a surviving mutant stay invisible.
#
# Nothing here gates a PR. The point is that a failure is SEEN, on a schedule,
# instead of waiting for a user to find it.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-deep
  cancel-in-progress: true

jobs:
  miri:
    name: miri (undefined behaviour)
    runs-on: ubuntu-latest
    # Without this the job runs to GitHub's 6-hour platform cap and is killed,
    # and the run then reports "cancelled" — which reads as harmless and is why
    # nobody noticed that this check had not completed once between 2026-08-06
    # and 2026-08-12. A real budget turns that silence into a failure. The suite
    # takes about a minute once the volume tests are skipped (they are marked
    # `#[cfg_attr(miri, ignore)]`), so 30 minutes is generous, not tight.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Run miri on the pure logic crates
        # `cli` shells out and touches the filesystem, which miri cannot model,
        # so the deterministic crates are the ones worth checking.
        run: |
          cargo +nightly miri setup
          cargo +nightly miri test -p innerwarden-graph
          cargo +nightly miri test -p innerwarden-notify

  mutants:
    name: cargo-mutants (do the tests actually test?)
    runs-on: ubuntu-latest
    # Must stay ABOVE the inner `timeout 150m` below, so cargo-mutants stops
    # itself and the report still uploads. If this is ever lowered under that,
    # the job goes back to dying silently with nothing to show.
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked --version ^25
      - name: Mutate the guardrail engine
        # A surviving mutant is a line the tests do not actually check. Scoped to
        # the screening engine: that is where a silently weakened check costs
        # protection rather than convenience.
        #
        # The inner `timeout` is what makes this job report anything at all. It
        # used to run until the JOB timeout killed it, which also killed the
        # upload step below, so every nightly since 2026-08-06 produced no
        # report and said "cancelled". Stopping ourselves first, under the job
        # budget, means a partial report still ships — and partial beats none,
        # because a surviving mutant is worth seeing even if the sweep is
        # incomplete.
        run: |
          timeout 150m cargo mutants --package innerwarden-agent-guard \
            --file 'crates/agent-guard/src/threats.rs' \
            --file 'crates/agent-guard/src/shell.rs' \
            --file 'crates/agent-guard/src/session.rs' \
            --timeout 120 --no-shuffle -j 2 \
            || echo "::warning::cargo-mutants did not finish inside 150m; the uploaded report is PARTIAL"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants-report
          path: mutants.out/

  perf:
    name: performance budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Hot-path budget
        # Also runs on every push; here it runs on a quiet machine, where a
        # genuine regression is not lost in runner noise.
        run: cargo test -p innerwarden-agent-guard --test hot_path_budget -- --nocapture
