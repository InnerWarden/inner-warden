name: Mutants on the pull request

# What a pull request changes in the screening engine, mutated as the nightly
# run mutates the day's changes (mutants-diff.yml: the same plan, shards and
# verdict). A mutant no test catches fails the pull request instead of the
# next night's run. Only a change under crates/agent-guard/src starts it.

on:
  pull_request:
    paths:
      - "crates/agent-guard/src/**"

permissions:
  contents: read

concurrency:
  # A new push replaces the run of the one before it.
  group: mutants-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mutants:
    name: cargo-mutants on the change
    uses: ./.github/workflows/mutants-diff.yml
    with:
      # The checkout is the pull request merged into its base; the diff from
      # that base is what the pull request changes.
      diff_base: ${{ github.event.pull_request.base.sha }}
      label: what the pull request changes
