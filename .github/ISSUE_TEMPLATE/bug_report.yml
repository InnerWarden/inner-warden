name: Bug report
description: Something does not work as the docs or the output say it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A security vulnerability goes to security@innerwarden.com, never here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran and what it did. Paste the exact command and output.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `innerwarden --version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: install
    attributes:
      label: How it was installed
      description: npm, the shell installer, a .deb/.rpm package, or cargo.
  - type: input
    id: agent
    attributes:
      label: Agent, if one is involved
      description: Claude Code, Cursor, Codex CLI, Gemini CLI, OpenClaw, another MCP client, or none.
