# nfpm config for the InnerWarden Community CLI Linux packages (.deb / .rpm).
# One binary at /usr/bin/innerwarden. Built per architecture by nfpm, which
# needs no dpkg or rpmbuild toolchain and runs anywhere.
#
# Build (see packaging/build-linux-packages.sh):
#   PKG_ARCH=amd64 PKG_VERSION=1.0.0 PKG_BIN=./innerwarden-linux-x86_64 \
#     nfpm package -f packaging/nfpm.yaml -p deb -t out/
name: innerwarden
arch: ${PKG_ARCH}
platform: linux
version: ${PKG_VERSION}
maintainer: "InnerWarden <hello@innerwarden.com>"
description: |
  Open-source guardrail for AI coding agents.
  Screens the shell commands and MCP/tool calls your agent runs and returns
  allow / review / deny, before they run. Monitor-only by default, and the
  evidence stays on your machine.
vendor: InnerWarden
homepage: https://innerwarden.com
license: Apache-2.0
section: utils
priority: optional
contents:
  - src: ${PKG_BIN}
    dst: /usr/bin/innerwarden
    file_info:
      mode: 0755
